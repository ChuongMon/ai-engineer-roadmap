[project]
name = "image-inspector"
version = "0.1.0"
description = "Image Inspector CLI - scan images with Pillow and export JSON report; includes NumPy + OpenCV CV labs"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0,<14",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
