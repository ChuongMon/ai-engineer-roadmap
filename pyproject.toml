[project]
name = "image-inspector"
version = "0.1.0"
description = "Image Inspector CLI - scan images with Pillow and export JSON report"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0,<14",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
