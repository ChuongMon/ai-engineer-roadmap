name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests (main package)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v
      - name: Run unit tests (computer vision labs)
        env:
          PYTHONPATH: computer_vision_labs/src
        run: python -m pytest computer_vision_labs/tests/ -v
